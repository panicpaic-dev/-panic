<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PanicCoin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #050608;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    a { color: inherit; }

    /* HERO IMAGE */
    .hero {
      width: 100%;
      height: 420px;
      background-image: url('https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38.jpeg?raw=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,255,136,0.3);
    }

    .hero-title {
      font-size: 48px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #000;
      margin-bottom: 15px;
    }

    .hero-buttons .btn {
      display: inline-block;
      padding: 12px 26px;
      margin: 8px;
      background-color: #00ff88;
      color: #000;
      font-weight: bold;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,255,136,0.4);
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background-color: #00e676;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .section {
      margin-bottom: 40px;
      background-color: #0c0f13;
      border-radius: 16px;
      padding: 25px 20px 30px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 24px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00ff88;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 18px rgba(0,0,0,0.8);
      transition: 0.3s;
      object-fit: cover;
      max-height: 260px;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 0 22px rgba(0,255,136,0.4);
    }

    footer {
      text-align: center;
      padding: 18px 10px 28px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<!-- HERO IMAGE -->
<div class="hero">
  <div class="hero-title">PanicCoin</div>

  <div class="hero-buttons">
    <a class="btn" href="YOUR_BUY_LINK" target="_blank">BUY</a>
    <a class="btn" href="YOUR_SELL_LINK" target="_blank">SELL</a>
  </div>
</div>

<div class="container">

  <div class="section">
    <h2>Panic Gallery</h2>
    <div class="gallery">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(1).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(2).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(3).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38%20(4).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40%20(1).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40%20(2).jpeg?raw=true">
      <img src="https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.40.jpeg?raw=true">
    </div>
  </div>

</div>

<footer>
  PanicCoin • Built on Solana • Meme project, not financial advice.
</footer>

</body>
</html>
