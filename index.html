<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PanicCoin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
    }

    /* SIDE LIGHT WAVES */
    .side-wave {
      position: fixed;
      width: 260px;
      height: 100%;
      background: radial-gradient(circle, rgba(0,255,136,0.25), transparent 70%);
      filter: blur(60px);
      animation: waveMove 6s infinite ease-in-out;
      z-index: -1;
    }

    .left-wave {
      left: -120px;
      top: 0;
    }

    .right-wave {
      right: -120px;
      top: 0;
    }

    @keyframes waveMove {
      0% { transform: translateY(0px); opacity: 0.7; }
      50% { transform: translateY(80px); opacity: 1; }
      100% { transform: translateY(0px); opacity: 0.7; }
    }

    /* FLOATING PARTICLES */
    .particle {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      opacity: 0.4;
      animation: floatParticle 8s infinite linear;
      z-index: -1;
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-80px) translateX(40px); opacity: 1; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }

    /* HERO IMAGE */
    .hero {
      width: 100%;
      height: 550px;
      background-image: url('https://github.com/panicpaic-dev/-panic/blob/main/WhatsApp%20Image%202026-08-16%20at%2016.26.38.jpeg?raw=true');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 20px #000;
      animation: fadeIn 1.5s ease-out;
    }

    .hero-title {
      font-size: 60px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 15px;
      animation: slideUp 1.5s ease-out;
    }

    /* BUY & SELL BUTTONS */
    .btn {
      display: inline-block;
      padding: 14px 32px;
      margin: 10px;
      background-color: #00ff88;
      color: #000;
      font-weight: bold;
      border-radius: 999px;
      text-decoration: none;
      font-size: 18px;
      animation: glow 2s infinite;
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-3px);
      background-color: #00e676;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 10px rgba(0,255,136,0.2); }
      50% { box-shadow: 0 0 20px rgba(0,255,136,0.6); }
      100% { box-shadow: 0 0 10px rgba(0,255,136,0.2); }
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
      animation: fadeIn 2s ease-out;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,255,150,0.3);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* SOCIAL BUTTONS */
    .social {
      margin: 40px 0;
      animation: fadeIn 2s ease-out;
    }
  </style>
</head>

<body>

<!-- SIDE WAVES -->
<div class="side-wave left-wave"></div>
<div class="side-wave right-wave"></div>

<!-- PARTICLES -->
