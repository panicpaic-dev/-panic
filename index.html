    body {
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 60px 20px;
      background: linear-gradient(135deg, #00ff88, #008844);
      color: #000;
      font-size: 40px;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 12px 26px;
      margin: 8px;
      background-color: #00ff88;
      color: #000;
      font-weight: bold;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,255,136,0.4);
      transition: 0.25s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background-color: #00e676;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,255,150,0.3);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .section {
      padding: 40px 20px;
      margin: 20px auto;
      max-width: 1000px;
      background-color: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,150,0.2);
    }
